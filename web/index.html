<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutabiq — مُطابِق</title>
  <style>
    :root {
      --bg: #0b1020;
      --card: #0f1834;
      --fg: #e6ecff;
      --muted: #b9c4e6;
      --primary: #7faeff;
      --success: #4ade80;
      --warning: #fbbf24;
      --danger: #f87171;
      --border: rgba(255,255,255,.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Tahoma, sans-serif;
      background: var(--bg);
      color: var(--fg);
      direction: rtl;
    }
    header { padding: 1.25rem 1rem 0.5rem; text-align: center; }
    header h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.25rem); }
    header p { margin: .25rem 0 0; color: var(--muted); }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1rem;
      box-shadow: 0 10px 30px -20px rgba(0,0,0,.5);
    }
    .form { padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .row { display: flex; flex-direction: column; gap: .5rem; }
    label { font-size: .9rem; color: var(--muted); }
    textarea {
      width: 100%;
      min-height: 110px;
      padding: .75rem .875rem;
      border-radius: .75rem;
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.04);
      color: var(--fg);
      font-size: 1rem;
      line-height: 1.8;
      resize: vertical;
    }
    textarea::placeholder { color: var(--muted); }
    textarea:focus { outline: 2px solid var(--primary); outline-offset: -1px; }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
    button {
      appearance: none;
      border: 1px solid rgba(255,255,255,.18);
      background: linear-gradient(180deg, rgba(127,174,255,.22), rgba(127,174,255,.12));
      color: var(--fg);
      padding: .6rem 1rem;
      border-radius: .75rem;
      font-size: .95rem;
      cursor: pointer;
    }
    button:hover { background: linear-gradient(180deg, rgba(127,174,255,.3), rgba(127,174,255,.18)); }
    button:disabled { opacity: .45; cursor: not-allowed; }
    .lang-toggle {
      margin-inline-start: auto;
      background: transparent;
      border: 1px solid var(--border);
      font-size: .85rem;
      padding: .4rem .8rem;
    }
    .small { font-size: .9rem; color: var(--muted); }
    #results { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .candidate {
      padding: .75rem .875rem;
      border: 1px dashed var(--border);
      border-radius: .75rem;
      background: rgba(255,255,255,.03);
    }
    .candidate h3 { margin: 0 0 .25rem; font-size: 1.05rem; line-height: 1.9; }
    .candidate a { color: var(--primary); text-decoration: none; word-break: break-word; }
    .candidate a:hover { text-decoration: underline; }
    .candidate .meta { color: var(--muted); font-size: .85rem; margin-top: .25rem; }
    .status-badge {
      display: inline-block;
      padding: .2rem .6rem;
      border-radius: .5rem;
      font-size: .8rem;
      font-weight: 600;
      margin-inline-end: .5rem;
    }
    .status-SUPPORTED { background: rgba(74,222,128,.15); color: var(--success); }
    .status-NEEDS_VERIFICATION { background: rgba(251,191,36,.15); color: var(--warning); }
    .status-REFER { background: rgba(248,113,113,.15); color: var(--danger); }
    .comparison { margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--border); }
    .comparison h4 { margin: 0 0 .3rem; font-size: .9rem; }
    .comparison ul { margin: 0; padding-inline-start: 1.2rem; }
    .comparison li { font-size: .85rem; margin-bottom: .25rem; line-height: 1.6; }
    .comparison .quote { color: var(--muted); font-style: italic; }
    .notice {
      padding: .6rem .875rem;
      border-radius: .75rem;
      background: rgba(251,191,36,.1);
      border: 1px solid rgba(251,191,36,.2);
      color: var(--warning);
      font-size: .85rem;
    }
    .referral {
      padding: .75rem .875rem;
      border-radius: .75rem;
      background: rgba(248,113,113,.08);
      border: 1px solid rgba(248,113,113,.15);
    }
    .referral h3 { margin: 0 0 .5rem; font-size: 1rem; color: var(--danger); }
    .referral p { margin: 0 0 .5rem; font-size: .9rem; }
    .referral a { color: var(--primary); }
    .footer { text-align: center; padding: .5rem 1rem 1.25rem; color: var(--muted); font-size: .85rem; }
    .empty-state { padding: 1rem; text-align: center; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1 id="app-title">مُطابِق — Mutabiq</h1>
    <p id="app-subtitle">أداة بحث عربية أولاً عن فتاوى منشورة. لا تصدر حكماً شرعياً.</p>
  </header>
  <main>
    <section class="card">
      <div class="form">
        <div class="row">
          <label for="q" id="label-q">صف سؤالك هنا (بالعربية أو بأي لغة)</label>
          <textarea id="q" dir="auto" placeholder="مثال: نسيت أصلي وكنت نايم في الشغل، باقي عندي صلاتين"></textarea>
        </div>
        <div class="actions">
          <button id="btn">بحث</button>
          <button id="btnClear">مسح</button>
          <button class="lang-toggle" id="btnLang">English</button>
          <span class="small" id="top3-label">أعلى 3 نتائج • بحث فقط</span>
        </div>
      </div>
    </section>
    <section class="card">
      <div id="results"></div>
    </section>
  </main>
  <footer class="footer">
    <div id="footer-text">النص المقتبس هو النص الأصلي من المصدر. الحالات غير المؤكدة تُحال إلى جهة الإفتاء.</div>
  </footer>
  <script>
    const i18n = {
      ar: {
        title: "مُطابِق — Mutabiq",
        subtitle: "أداة بحث عربية أولاً عن فتاوى منشورة. لا تصدر حكماً شرعياً.",
        label: "صف سؤالك هنا (بالعربية أو بأي لغة)",
        placeholder: "مثال: نسيت أصلي وكنت نايم في الشغل، باقي عندي صلاتين",
        search: "بحث",
        clear: "مسح",
        top3: "أعلى 3 نتائج • بحث فقط",
        footer: "النص المقتبس هو النص الأصلي من المصدر. الحالات غير المؤكدة تُحال إلى جهة الإفتاء.",
        no_matches: "لم يتم العثور على نتائج مطابقة.",
        error: "خطأ",
        searching: "جارٍ البحث...",
        status_supported: "مؤيَّد بالمصادر",
        status_needs_verification: "يحتاج مزيداً من التحقق",
        status_refer: "يُحال إلى جهة الإفتاء",
        similarities: "أوجه التشابه",
        differences: "الفروق",
        degraded_notice: "تنبيه: النموذج اللغوي غير متاح حالياً. النتائج بحث فقط بدون مقارنة. عامل هذه النتيجة كـ «يحتاج مزيداً من التحقق».",
        referral_title: "لم يتم العثور على فتوى منشورة مشابهة",
        referral_text: "لم نتمكن من العثور على فتوى منشورة تطابق سؤالك، أو أن الموضوع ضمن المواضيع الحساسة. ننصح بمراجعة جهة إفتاء مختصة:",
        referral_authorities: [
          { name: "الإسلام سؤال وجواب", url: "https://islamqa.info/ar/ask" },
          { name: "دار الإسلام", url: "https://islamhouse.net/ar/ask" }
        ],
        sensitive_title: "موضوع حساس",
        sensitive_text: "هذا الموضوع ضمن المواضيع التي لا يجوز الإجابة فيها آلياً. ننصح بمراجعة جهة إفتاء مختصة.",
        score: "النتيجة",
        id: "المعرف"
      },
      en: {
        title: "Mutabiq — مُطابِق",
        subtitle: "Arabic-first retrieval of published fatwas. No AI ruling generated.",
        label: "Describe your question (Arabic or any language)",
        placeholder: "e.g. I forgot to pray while sleeping at work, I still have 2 prayers left",
        search: "Search",
        clear: "Clear",
        top3: "Top 3 results • Retrieval only",
        footer: "Quoted text is verbatim from the source. Uncertain cases are referred to a fatwa authority.",
        no_matches: "No matches found.",
        error: "Error",
        searching: "Searching...",
        status_supported: "SUPPORTED",
        status_needs_verification: "NEEDS VERIFICATION",
        status_refer: "REFER",
        similarities: "Similarities",
        differences: "Differences",
        degraded_notice: "Notice: LLM unavailable. Results are retrieval-only without case comparison. Treat as NEEDS VERIFICATION.",
        referral_title: "No similar published fatwa found",
        referral_text: "We could not find a published fatwa matching your question, or the topic is sensitive. Please consult a qualified fatwa authority:",
        referral_authorities: [
          { name: "Islam Q&A", url: "https://islamqa.info/ar/ask" },
          { name: "Dar Al-Islam", url: "https://islamhouse.net/ar/ask" }
        ],
        sensitive_title: "Sensitive topic",
        sensitive_text: "This topic is in the sensitive list and cannot be answered automatically. Please consult a qualified fatwa authority.",
        score: "Score",
        id: "ID"
      }
    };

    let currentLang = 'ar';

    function t(key) {
      return i18n[currentLang][key] || key;
    }

    function applyLang() {
      const dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = dir;
      document.getElementById('app-title').textContent = t('title');
      document.getElementById('app-subtitle').textContent = t('subtitle');
      document.getElementById('label-q').textContent = t('label');
      document.getElementById('q').placeholder = t('placeholder');
      document.getElementById('btn').textContent = t('search');
      document.getElementById('btnClear').textContent = t('clear');
      document.getElementById('btnLang').textContent = currentLang === 'ar' ? 'English' : 'العربية';
      document.getElementById('top3-label').textContent = t('top3');
      document.getElementById('footer-text').textContent = t('footer');
    }

    document.getElementById('btnLang').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      applyLang();
    });

    function statusLabel(status) {
      if (status === 'SUPPORTED') return t('status_supported');
      if (status === 'NEEDS_VERIFICATION') return t('status_needs_verification');
      return t('status_refer');
    }

    function renderReferral(data) {
      const div = document.createElement('div');
      div.className = 'referral';
      const h3 = document.createElement('h3');
      h3.textContent = data.sensitive_group ? t('sensitive_title') : t('referral_title');
      const p = document.createElement('p');
      p.textContent = data.sensitive_group ? t('sensitive_text') : t('referral_text');
      div.appendChild(h3);
      div.appendChild(p);
      const ul = document.createElement('ul');
      ul.style.cssText = 'padding-inline-start:1.2rem;margin:0;';
      const authorities = t('referral_authorities');
      authorities.forEach(a => {
        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = a.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = a.name;
        li.appendChild(link);
        ul.appendChild(li);
      });
      div.appendChild(ul);
      return div;
    }

    function renderComparison(comparison) {
      if (!comparison) return null;
      const div = document.createElement('div');
      div.className = 'comparison';
      if (comparison.similarities && comparison.similarities.length > 0) {
        const h4 = document.createElement('h4');
        h4.textContent = t('similarities');
        div.appendChild(h4);
        const ul = document.createElement('ul');
        comparison.similarities.forEach(s => {
          const li = document.createElement('li');
          li.textContent = s.statement;
          if (s.quote) {
            const quote = document.createElement('div');
            quote.className = 'quote';
            quote.textContent = '"' + s.quote + '"';
            li.appendChild(quote);
          }
          ul.appendChild(li);
        });
        div.appendChild(ul);
      }
      if (comparison.differences && comparison.differences.length > 0) {
        const h4 = document.createElement('h4');
        h4.textContent = t('differences');
        div.appendChild(h4);
        const ul = document.createElement('ul');
        comparison.differences.forEach(d => {
          const li = document.createElement('li');
          li.textContent = d.statement;
          if (d.quote) {
            const quote = document.createElement('div');
            quote.className = 'quote';
            quote.textContent = '"' + d.quote + '"';
            li.appendChild(quote);
          }
          ul.appendChild(li);
        });
        div.appendChild(ul);
      }
      return div;
    }

    function renderResults(data) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      if (data.notice) {
        const notice = document.createElement('div');
        notice.className = 'notice';
        notice.textContent = data.notice;
        container.appendChild(notice);
      }

      if (data.status === 'REFER' || data.candidates.length === 0) {
        container.appendChild(renderReferral(data));
        return;
      }

      data.candidates.forEach(c => {
        const div = document.createElement('div');
        div.className = 'candidate';

        const h3 = document.createElement('h3');
        const badge = document.createElement('span');
        badge.className = 'status-badge status-' + data.status;
        badge.textContent = statusLabel(data.status);
        h3.appendChild(badge);
        h3.appendChild(document.createTextNode(c.title || '(untitled)'));
        div.appendChild(h3);

        const a = document.createElement('a');
        a.href = c.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = c.url;
        div.appendChild(a);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = t('id') + ': ' + c.id + (c.match_score != null ? ' • ' + t('score') + ': ' + c.match_score.toFixed(4) : '');
        div.appendChild(meta);

        const comp = renderComparison(data.comparison);
        if (comp) div.appendChild(comp);

        container.appendChild(div);
      });
    }

    document.getElementById('btn').addEventListener('click', async () => {
      const qEl = document.getElementById('q');
      const btn = document.getElementById('btn');
      const question = qEl.value.trim();
      if (!question) return;

      btn.disabled = true;
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '<div class="empty-state">' + t('searching') + '</div>';

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, top_k: 3 })
        });
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        const data = await res.json();
        renderResults(data);
      } catch (e) {
        resultsEl.innerHTML = '<div class="empty-state">' + t('error') + ': ' + e.message + '</div>';
      } finally {
        btn.disabled = false;
      }
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      document.getElementById('q').value = '';
      document.getElementById('results').innerHTML = '';
    });

    applyLang();
  </script>
</body>
</html>
