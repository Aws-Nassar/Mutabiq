<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutabiq — مُطابِق</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <style>
    :root { --bg: #0b1020; --card: #0f1834; --fg: #e6ecff; --muted: #b9c4e6; --primary: #7faeff; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Tahoma, sans-serif; background: var(--bg); color: var(--fg); direction: rtl; }
    header { padding: 1.25rem 1rem 0.5rem; text-align: center; }
    header h1 { margin: 0; font-size: clamp(1.5rem, 5vw, 2.25rem); }
    header p { margin: .25rem 0 0; color: var(--muted); }
    main { max-width: 720px; margin: 0 auto; padding: 1rem; display: flex; flex-direction: column; gap: 1rem; }
    .card { background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 1rem; box-shadow: 0 10px 30px -20px rgba(0,0,0,.5); }
    .form { padding: 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .row { display: flex; flex-direction: column; gap: .5rem; }
    textarea { width: 100%; min-height: 110px; padding: .75rem .875rem; border-radius: .75rem; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.04); color: var(--fg); font-size: 1rem; line-height: 1.8; }
    textarea::placeholder { color: var(--muted); }
    .actions { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: flex-start; }
    button { appearance: none; border: 1px solid rgba(255,255,255,.18); background: linear-gradient(180deg, rgba(127,174,255,.22), rgba(127,174,255,.12)); color: var(--fg); padding: .6rem 1rem; border-radius: .75rem; font-size: .95rem; cursor: pointer; }
    button:disabled { opacity: .45; cursor: not-allowed; }
    #results { padding: 0 1rem 1rem; display: flex; flex-direction: column; gap: .75rem; }
    .candidate { padding: .75rem .875rem; border: 1px dashed rgba(255,255,255,.12); border-radius: .75rem; background: rgba(255,255,255,.03); }
    .candidate h3 { margin: 0 0 .25rem; font-size: 1.05rem; line-height: 1.9; }
    .candidate a { color: var(--primary); text-decoration: none; word-break: break-word; }
    .candidate .meta { color: var(--muted); font-size: .9rem; margin-top: .25rem; }
    .small { font-size: .9rem; color: var(--muted); }
    .footer { text-align: center; padding: .5rem 1rem 1.25rem; color: var(--muted); }
  </style>
</head>
<body>
  <header>
    <h1>مُطابِق — Mutabiq</h1>
    <p>Arabic-first retrieval of published fatwas. No AI ruling generated.</p>
  </header>
  <main>
    <section class="card">
      <div class="form">
        <div class="row">
          <label for="q">Describe your question (Arabic or any language)</label>
          <textarea id="q" dir="auto" placeholder="e.g. نسيت أصلي وكنت نايم في الشغل، باقي عندي صلاتين"></textarea>
        </div>
        <div class="actions">
          <button id="btn">Search</button>
          <button id="btnClear">Clear</button>
          <span class="small">Top 3 results • Retrieval only</span>
        </div>
      </div>
    </section>
    <section class="card">
      <div id="results"></div>
    </section>
  </main>
  <footer class="footer">
    <div>Fatwa text is verbatim from the source. Uncertain cases are referred.</div>
  </footer>
  <script>
    const qEl = document.getElementById('q');
    const btn = document.getElementById('btn');
    const btnClear = document.getElementById('btnClear');
    const resultsEl = document.getElementById('results');
    btn.addEventListener('click', async () => {
      const question = qEl.value.trim();
      if (!question) return;
      btn.disabled = true;
      resultsEl.innerHTML = '<div class="small">Searching...</div>';
      try {
        const res = await fetch('/api/query', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question, top_k: 3 }) });
        if (!res.ok) throw new Error('Request failed');
        const data = await res.json();
        resultsEl.innerHTML = '';
        if (data.candidates.length === 0) {
          resultsEl.innerHTML = '<div class="small">No matches found.</div>';
        } else {
          data.candidates.forEach(c => {
            const div = document.createElement('div');
            div.className = 'candidate';
            const h3 = document.createElement('h3');
            h3.textContent = c.title || '(untitled)';
            const a = document.createElement('a');
            a.href = c.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = c.url;
            const meta = document.createElement('div');
            meta.className = 'meta';
            meta.textContent = `ID: ${c.id}${c.score != null ? ' • score: ' + c.score.toFixed(4) : ''}`;
            div.appendChild(h3); div.appendChild(a); div.appendChild(meta);
            resultsEl.appendChild(div);
          });
        }
      } catch (e) {
        resultsEl.innerHTML = '<div class="small">Error: ' + e.message + '</div>';
      } finally {
        btn.disabled = false;
      }
    });
    btnClear.addEventListener('click', () => { qEl.value = ''; resultsEl.innerHTML = ''; });
  </script>
</body>
</html>
