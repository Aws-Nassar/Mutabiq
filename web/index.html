<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mutabiq — مُطابِق</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='45' fill='%231B5E20'/%3E%3Cpath d='M60 25 A20 20 0 1 0 60 75 A15 15 0 1 1 60 25Z' fill='%23C9A227'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --green-900: #0D1B0E;
      --green-800: #1B5E20;
      --green-700: #2E7D32;
      --green-600: #388E3C;
      --green-500: #43A047;
      --green-100: #E8F5E9;
      --green-50: #F1F8E9;
      --gold: #C9A227;
      --gold-light: #D4AF37;
      --bg: #FAFAF5;
      --card: #FFFFFF;
      --fg: #1A1A1A;
      --muted: #666666;
      --border: #E0E0E0;
      --success: #2E7D32;
      --warning: #F57F17;
      --danger: #C62828;
      --shadow: 0 2px 8px rgba(0,0,0,0.08);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.12);
    }
    [data-theme="dark"] {
      --bg: #0A1A0C;
      --card: #14251A;
      --fg: #E8F5E9;
      --muted: #81C784;
      --border: #1B3A1F;
      --green-100: #1B3A1F;
      --green-50: #14251A;
      --shadow: 0 2px 8px rgba(0,0,0,0.4);
      --shadow-lg: 0 4px 16px rgba(0,0,0,0.5);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', 'Amiri', system-ui, sans-serif;
      background: var(--bg);
      color: var(--fg);
      line-height: 1.6;
      min-height: 100vh;
    }

    /* Islamic geometric pattern background */
    body::before {
      content: '';
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 0L60 30L30 60L0 30Z' fill='none' stroke='%231B5E20' stroke-width='0.5' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: -1;
    }

    /* Header */
    header {
      background: linear-gradient(135deg, var(--green-800) 0%, var(--green-700) 50%, var(--green-600) 100%);
      color: white;
      padding: 2rem 1rem 1.5rem;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M40 0L80 40L40 80L0 40Z' fill='none' stroke='white' stroke-width='0.5' opacity='0.1'/%3E%3C/svg%3E");
      pointer-events: none;
    }
    header::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 4px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    header h1 {
      font-family: 'Amiri', serif;
      font-size: clamp(2.5rem, 7vw, 3.5rem);
      font-weight: 700;
      margin-bottom: 0.75rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.2);
      line-height: 1.4;
    }
    header p {
      font-size: 1.1rem;
      opacity: 0.95;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.8;
    }
    [data-theme="dark"] header {
      background: linear-gradient(135deg, #0D2B0F 0%, #1B5E20 50%, #0D2B0F 100%);
    }

    /* Main layout: sidebar + chat area */
    main {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1.5rem 1rem;
      display: flex;
      gap: 1.5rem;
      align-items: flex-start;
    }

    /* Sidebar for history */
    .sidebar {
      width: 320px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .sidebar .card {
      max-height: 80vh;
      overflow-y: auto;
    }
    .sidebar h3 {
      font-family: 'Amiri', serif;
      font-size: 1.2rem;
      color: var(--green-800);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    [data-theme="dark"] .sidebar h3 {
      color: var(--gold);
    }

    /* Chat area */
    .chat-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1rem;
      min-width: 0;
    }
    #results {
      flex: 1;
      min-height: 200px;
      max-height: 70vh;
      overflow-y: auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    #results:empty::before {
      content: 'اكتب سؤالك لتحصل على نتيجة...';
      color: var(--muted);
      text-align: center;
      padding: 2rem;
      display: block;
    }
    [data-theme="dark"] #results:empty::before {
      color: #81C784;
    }

    /* Input area pinned at bottom of chat */
    .input-area {
      padding: 1rem 1.5rem;
      border-top: 1px solid var(--border);
    }

    /* Cards */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: hidden;
      position: relative;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    /* Form */
    .form { padding: 1.5rem; }
    .form label {
      display: block;
      font-weight: 700;
      margin-bottom: 0.75rem;
      color: var(--green-800);
      font-size: 1.1rem;
      font-family: 'Amiri', serif;
    }
    [data-theme="dark"] .form label {
      color: var(--gold);
    }
    textarea {
      width: 100%;
      min-height: 140px;
      padding: 1rem 1.25rem;
      border: 2px solid var(--border);
      border-radius: 10px;
      font-size: 1.1rem;
      font-family: inherit;
      line-height: 2;
      resize: vertical;
      transition: border-color 0.2s;
      background: var(--card);
      color: var(--fg);
    }
    [data-theme="dark"] textarea {
      background: #1A2F1F;
      color: #E8F5E9;
      border-color: #2D4A2F;
    }
    [data-theme="dark"] textarea::placeholder {
      color: #5A8A5A;
    }
    textarea:focus {
      outline: none;
      border-color: var(--green-600);
    }
    textarea::placeholder { color: #999; }

    .actions {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 1rem;
    }
    button {
      appearance: none;
      border: none;
      padding: 0.625rem 1.25rem;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--green-700), var(--green-600));
      color: white;
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, var(--green-800), var(--green-700));
      transform: translateY(-1px);
      box-shadow: var(--shadow-lg);
    }
    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-secondary {
      background: var(--green-100);
      color: var(--green-800);
    }
    [data-theme="dark"] .btn-secondary {
      background: #1B3A1F;
      color: #81C784;
    }
    .btn-secondary:hover {
      background: var(--green-50);
    }
    [data-theme="dark"] .btn-secondary:hover {
      background: #254A28;
    }
    .btn-lang {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
    }
    [data-theme="dark"] .btn-lang {
      color: var(--muted);
      border-color: var(--border);
    }
    .btn-lang:hover {
      border-color: var(--green-600);
      color: var(--green-700);
    }
    [data-theme="dark"] .btn-lang:hover {
      border-color: var(--gold);
      color: var(--gold);
    }

    /* Results */
    #results { padding: 0 1.5rem 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
    .candidate {
      padding: 1rem;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--card);
      transition: box-shadow 0.2s;
    }
    .candidate:hover {
      box-shadow: var(--shadow-lg);
    }
    .candidate h3 {
      font-size: 1.2rem;
      margin-bottom: 0.5rem;
      line-height: 1.8;
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.5rem;
      font-family: 'Amiri', serif;
    }
    .candidate a {
      color: var(--green-700);
      text-decoration: none;
      word-break: break-all;
      font-size: 0.9rem;
    }
    .candidate a:hover { text-decoration: underline; }
    .candidate .meta {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.5rem;
    }

    /* Status badges */
    .status-badge {
      display: inline-flex;
      align-items: center;
      padding: 0.3rem 0.9rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-family: 'Inter', sans-serif;
    }
    [data-theme="dark"] .status-SUPPORTED {
      background: #1B3A1F;
      color: #81C784;
      border-color: #2E5A2F;
    }
    [data-theme="dark"] .status-NEEDS_VERIFICATION {
      background: #3E2F1F;
      color: #FFD54F;
      border-color: #6B5535;
    }
    [data-theme="dark"] .status-REFER {
      background: #3D1C1C;
      color: #EF9A9A;
      border-color: #5C2E2E;
    }
    .status-SUPPORTED {
      background: #E8F5E9;
      color: var(--success);
      border: 1px solid #A5D6A7;
    }
    .status-NEEDS_VERIFICATION {
      background: #FFF8E1;
      color: var(--warning);
      border: 1px solid #FFE082;
    }
    .status-REFER {
      background: #FFEBEE;
      color: var(--danger);
      border: 1px solid #EF9A9A;
    }

    /* Comparison section */
    .comparison {
      margin-top: 0.75rem;
      padding-top: 0.75rem;
      border-top: 1px dashed var(--border);
    }
    .comparison h4 {
      font-size: 1rem;
      color: var(--green-700);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-family: 'Amiri', serif;
      font-weight: 700;
    }
    [data-theme="dark"] .comparison h4 {
      color: var(--gold);
    }
    .comparison h4::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--gold);
      border-radius: 2px;
    }
    .comparison ul {
      list-style: none;
      padding: 0;
    }
    .comparison li {
      font-size: 0.95rem;
      margin-bottom: 0.5rem;
      padding-right: 1.25rem;
      position: relative;
      line-height: 1.8;
    }
    .comparison li::before {
      content: '◆';
      position: absolute;
      right: 0;
      color: var(--gold);
      font-size: 0.6rem;
      top: 0.2rem;
    }
    .comparison .quote {
      color: var(--muted);
      font-size: 0.8rem;
      font-style: italic;
      margin-top: 0.25rem;
      padding-right: 1rem;
    }

    /* Notice */
    .notice {
      padding: 0.75rem 1rem;
      border-radius: 8px;
      background: #FFF8E1;
      border: 1px solid #FFE082;
      color: var(--warning);
      font-size: 0.9rem;
    }
    [data-theme="dark"] .notice {
      background: #3E2F1F;
      border-color: #6B5535;
      color: #FFD54F;
    }

    /* Referral */
    .referral {
      padding: 1.25rem;
      border-radius: 10px;
      background: #FFEBEE;
      border: 1px solid #EF9A9A;
    }
    [data-theme="dark"] .referral {
      background: #3D1C1C;
      border-color: #5C2E2E;
    }
    .referral h3 {
      color: var(--danger);
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
      font-family: 'Amiri', serif;
    }
    [data-theme="dark"] .referral h3 {
      color: #EF9A9A;
    }
    .referral p {
      font-size: 1rem;
      margin-bottom: 0.75rem;
      line-height: 1.8;
    }
    [data-theme="dark"] .referral p {
      color: #E8F5E9;
    }
    .referral ul {
      list-style: none;
      padding: 0;
    }
    .referral li {
      margin-bottom: 0.5rem;
    }
    .referral a {
      color: var(--green-700);
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
    }
    [data-theme="dark"] .referral a {
      color: var(--gold);
    }
    .referral a:hover { text-decoration: underline; }

    /* Footer */
    footer {
      text-align: center;
      padding: 2rem 1rem;
      color: var(--muted);
      font-size: 0.9rem;
      border-top: 1px solid var(--border);
      margin-top: 2rem;
    }
    footer::before {
      content: '☪';
      display: block;
      font-size: 1.5rem;
      color: var(--gold);
      margin-bottom: 0.5rem;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--green-100);
      border-top-color: var(--green-700);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* History */
    #history-section {
      margin-top: 1rem;
    }
    #history-section h3 {
      font-family: 'Amiri', serif;
      font-size: 1.2rem;
      color: var(--green-800);
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    [data-theme="dark"] #history-section h3 {
      color: var(--gold);
    }
    .history-item {
      padding: 0.5rem 0.75rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: var(--green-50); }
    [data-theme="dark"] .history-item:hover { background: #1A2F1F; }
    .history-item .q {
      font-size: 0.9rem;
      line-height: 1.5;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }
    .history-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .dot-SUPPORTED { background: #43A047; }
    .dot-NEEDS_VERIFICATION { background: #FBC02D; }
    .dot-REFER { background: #E53935; }
    .history-item .meta {
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 0.15rem;
    }
    .history-empty {
      color: var(--muted);
      font-size: 0.9rem;
      padding: 0.5rem 0;
    }

    /* Empty state */
    .empty-state {
      padding: 2rem;
      text-align: center;
      color: var(--muted);
    }

    /* Ornamental divider */
    .divider {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin: 1rem 0;
    }
    .divider::before,
    .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }
    .divider-icon {
      color: var(--gold);
      font-size: 1.2rem;
    }

    /* Responsive: mobile */
    @media (max-width: 768px) {
      header { padding: 1.5rem 1rem 1rem; }
      main { flex-direction: column; padding: 1rem 0.75rem; }
      .sidebar { width: 100%; }
      .sidebar .card { max-height: 300px; }
      #results { max-height: none; }
    }
  </style>
</head>
<body>
  <header>
    <h1>مُطابِق — Mutabiq</h1>
    <p>أداة بحث عربية أولاً عن فتاوى منشورة. لا تصدر حكماً شرعياً.</p>
  </header>

  <main>
    <aside class="sidebar">
      <section class="card">
        <div class="form" style="padding-bottom:1rem;">
          <h3>
            سجل البحث
            <button id="btnClearHistory" class="btn-lang" style="font-size:0.8rem;">مسح السجل</button>
          </h3>
          <div id="history-list"></div>
        </div>
      </section>
    </aside>

    <div class="chat-area">
      <section class="card">
        <div id="results"></div>
      </section>

      <section class="card">
        <div class="input-area">
          <label for="q" id="label-q">صف سؤالك هنا (بالعربية أو بأي لغة)</label>
          <textarea id="q" dir="auto" placeholder="مثال: نسيت أصلي وكنت نايم في الشغل، باقي عندي صلاتين"></textarea>
          <div class="actions">
            <button id="btn" class="btn-primary">بحث</button>
            <button id="btnClear" class="btn-secondary">مسح</button>
            <button class="btn-lang" id="btnLang">English</button>
            <button class="btn-lang" id="btnTheme">🌙</button>
            <span class="small" id="top3-label" style="color:var(--muted);font-size:0.85rem;">أعلى 3 نتائج • بحث فقط</span>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <div id="footer-text">النص المقتبس هو النص الأصلي من المصدر. الحالات غير المؤكدة تُحال إلى جهة الإفتاء.</div>
  </footer>

        referral_authorities: [
          { name: "Islam Q&A", url: "https://islamqa.info/ar/ask" },
          { name: "Dar Al-Islam", url: "https://islamhouse.net/ar/ask" }
        ],
        sensitive_title: "Sensitive topic",
        sensitive_text: "This topic is in the sensitive list and cannot be answered automatically. Please consult a qualified fatwa authority.",
        score: "Score",
        id: "ID"
      }
    };

    let currentLang = 'ar';

    function t(key) {
      return i18n[currentLang][key] || key;
    }

    function applyLang() {
      const dir = currentLang === 'ar' ? 'rtl' : 'ltr';
      document.documentElement.lang = currentLang;
      document.documentElement.dir = dir;
      document.getElementById('app-title')?.remove();
      document.querySelector('header h1').textContent = t('title');
      document.querySelector('header p').textContent = t('subtitle');
      document.getElementById('label-q').textContent = t('label');
      document.getElementById('q').placeholder = t('placeholder');
      document.getElementById('btn').textContent = t('search');
      document.getElementById('btnClear').textContent = t('clear');
      document.getElementById('btnLang').textContent = currentLang === 'ar' ? 'English' : 'العربية';
      document.getElementById('top3-label').textContent = t('top3');
      document.getElementById('footer-text').textContent = t('footer');
    }

    document.getElementById('btnLang').addEventListener('click', () => {
      currentLang = currentLang === 'ar' ? 'en' : 'ar';
      applyLang();
    });

    function statusLabel(status) {
      if (status === 'SUPPORTED') return t('status_supported');
      if (status === 'NEEDS_VERIFICATION') return t('status_needs_verification');
      return t('status_refer');
    }

    function renderReferral(data) {
      const div = document.createElement('div');
      div.className = 'referral';
      const h3 = document.createElement('h3');
      h3.textContent = data.sensitive_group ? t('sensitive_title') : t('referral_title');
      const p = document.createElement('p');
      p.textContent = data.sensitive_group ? t('sensitive_text') : t('referral_text');
      div.appendChild(h3);
      div.appendChild(p);
      const ul = document.createElement('ul');
      const authorities = t('referral_authorities');
      authorities.forEach(a => {
        const li = document.createElement('li');
        const link = document.createElement('a');
        link.href = a.url;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = a.name;
        li.appendChild(link);
        ul.appendChild(li);
      });
      div.appendChild(ul);
      return div;
    }

    function renderComparison(comparison) {
      if (!comparison) return null;
      const div = document.createElement('div');
      div.className = 'comparison';
      if (comparison.similarities && comparison.similarities.length > 0) {
        const h4 = document.createElement('h4');
        h4.textContent = t('similarities');
        div.appendChild(h4);
        const ul = document.createElement('ul');
        comparison.similarities.forEach(s => {
          const li = document.createElement('li');
          li.textContent = s.statement;
          if (s.quote) {
            const quote = document.createElement('div');
            quote.className = 'quote';
            quote.textContent = '"' + s.quote + '"';
            li.appendChild(quote);
          }
          ul.appendChild(li);
        });
        div.appendChild(ul);
      }
      if (comparison.differences && comparison.differences.length > 0) {
        const h4 = document.createElement('h4');
        h4.textContent = t('differences');
        div.appendChild(h4);
        const ul = document.createElement('ul');
        comparison.differences.forEach(d => {
          const li = document.createElement('li');
          li.textContent = d.statement;
          if (d.quote) {
            const quote = document.createElement('div');
            quote.className = 'quote';
            quote.textContent = '"' + d.quote + '"';
            li.appendChild(quote);
          }
          ul.appendChild(li);
        });
        div.appendChild(ul);
      }
      return div;
    }

    function renderResults(data) {
      const container = document.getElementById('results');
      container.innerHTML = '';

      if (data.notice) {
        const notice = document.createElement('div');
        notice.className = 'notice';
        notice.textContent = data.notice;
        container.appendChild(notice);
      }

      if (data.status === 'REFER' || data.candidates.length === 0) {
        container.appendChild(renderReferral(data));
        return;
      }

      data.candidates.forEach(c => {
        const div = document.createElement('div');
        div.className = 'candidate';

        const h3 = document.createElement('h3');
        const badge = document.createElement('span');
        badge.className = 'status-badge status-' + data.status;
        badge.textContent = statusLabel(data.status);
        h3.appendChild(badge);
        h3.appendChild(document.createTextNode(c.title || '(untitled)'));
        div.appendChild(h3);

        const a = document.createElement('a');
        a.href = c.url;
        a.target = '_blank';
        a.rel = 'noopener noreferrer';
        a.textContent = c.url;
        div.appendChild(a);

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = t('id') + ': ' + c.id + (c.match_score != null ? ' • ' + t('score') + ': ' + c.match_score.toFixed(4) : '');
        div.appendChild(meta);

        const comp = renderComparison(data.comparison);
        if (comp) div.appendChild(comp);

        container.appendChild(div);
      });
    }

    document.getElementById('btn').addEventListener('click', async () => {
      const qEl = document.getElementById('q');
      const btn = document.getElementById('btn');
      const question = qEl.value.trim();
      if (!question) return;

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span> ' + t('searching');
      const resultsEl = document.getElementById('results');
      resultsEl.innerHTML = '<div class="empty-state">' + t('searching') + '</div>';

      try {
        const res = await fetch('/api/query', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ question, top_k: 3 })
        });
        if (!res.ok) throw new Error('Request failed: ' + res.status);
        const data = await res.json();
        renderResults(data);
        saveToHistory(question, data);
      } catch (e) {
        resultsEl.innerHTML = '<div class="empty-state">' + t('error') + ': ' + e.message + '</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = t('search');
      }
    });

    document.getElementById('btnClear').addEventListener('click', () => {
      document.getElementById('q').value = '';
      document.getElementById('results').innerHTML = '';
    });

    // Dark mode toggle
    const btnTheme = document.getElementById('btnTheme');
    const savedTheme = localStorage.getItem('mutabiq-theme');
    if (savedTheme === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
      btnTheme.textContent = '☀️';
    }
    btnTheme.addEventListener('click', () => {
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      if (isDark) {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('mutabiq-theme', 'light');
        btnTheme.textContent = '🌙';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('mutabiq-theme', 'dark');
        btnTheme.textContent = '☀️';
      }
    });

    // Enter key to search
    document.getElementById('q').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        document.getElementById('btn').click();
      }
    });

    // History
    function getHistory() {
      try {
        return JSON.parse(localStorage.getItem('mutabiq_history') || '[]');
      } catch {
        return [];
      }
    }

    function saveToHistory(question, data) {
      const history = getHistory();
      history.unshift({
        id: Date.now().toString(),
        question: question,
        timestamp: Date.now(),
        full_response: data
      });
      if (history.length > 20) history.pop();
      localStorage.setItem('mutabiq_history', JSON.stringify(history));
      renderHistory();
    }

    function clearHistory() {
      localStorage.removeItem('mutabiq_history');
      renderHistory();
    }

    function renderHistory() {
      const list = document.getElementById('history-list');
      const history = getHistory();
      if (history.length === 0) {
        list.innerHTML = '<div class="history-empty">لا يوجد سجل بعد.</div>';
        return;
      }
      list.innerHTML = '';
      history.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        const status = item.full_response.status || 'REFER';
        const qShort = item.question.length > 60 ? item.question.slice(0, 60) + '…' : item.question;
        const d = new Date(item.timestamp);
        const dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
        div.innerHTML = '<div class="q"><span class="history-dot dot-' + status + '"></span>' + qShort + '</div><div class="meta">' + dateStr + '</div>';
        div.addEventListener('click', () => {
          renderResults(item.full_response);
        });
        list.appendChild(div);
      });
    }

    document.getElementById('btnClearHistory').addEventListener('click', clearHistory);
    renderHistory();

    applyLang();
  </script>
</body>
</html>
