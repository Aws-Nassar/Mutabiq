  # ---------------------------------------------------------------------
  - id: ruling_on_named_individual
    label_ar: الحكم على شخص بعينه
    description: >-
      Asking whether a specific person acted rightly or wrongly. Judging named
      individuals is explicitly out of scope per the organizer's reference
      (المرجعية_الشرعية.pdf p.2). Terms are chosen as THIRD-PARTY markers: they
      fire when the user is asking about someone else rather than about their own
      situation.
    terms:
      - صديقي
      - صديقه
      - جاري
      - جاره
      - جيران
      - زميلي
      - زميل
      - مديري
      - معلم
      - معلمي
